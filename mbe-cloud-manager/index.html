<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBE - Cloud Infra Dashboard</title>
    
    <!--  Import Map for Serverless AWS Management -->
    <script type="importmap">
    {
        "imports": {
            "@aws-sdk/client-ec2": "https://esm.sh"
        }
    }
    </script>

    <!--  Tailwind CSS Core Platform / Allan - MBE Engineering-->
    <script src="https://cdn.tailwindcss.com"></script>

    <!--  Custom Styles for Core Interface Animations & Shimmers -->
    <style>
        @keyframes subtle-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
        .glow-cyan {
            box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.4);
        }
        .glow-emerald {
            box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.5);
        }
        .glow-rose {
            box-shadow: 0 0 25px -5px rgba(244, 63, 94, 0.5);
        }
        .glassmorphism {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-[#0b1329] text-slate-100 font-sans flex items-center justify-center h-screen m-0 relative overflow-hidden">

    <!-- Cyberpunk Abstract Background Blurs -->
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- 1. SECURE ACCESS MODAL (AUTHENTICATION WALL) -->
       <div id="login-modal" class="fixed inset-0 bg-[#070a13]/90 flex items-center justify-center z-50 transition-all duration-300">
        <div class="glassmorphism p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700/50 mx-4 transition-transform duration-500 glow-cyan">
            <div class="text-center mb-6">
                <!-- CIRCUITO CORRIGIDO: Agora com fundo ciano, borda neon e animação pulsante -->
                <div class="inline-flex items-center justify-center w-14 h-14 bg-cyan-950/80 border-2 border-cyan-500/80 rounded-full shadow-[0_0_15px_rgba(6,182,212,0.5)] mb-3 animate-pulse">
                    <span class="text-2xl text-cyan-400"></span>
                </div>
                <h2 class="text-2xl font-black tracking-tight text-cyan-400">Autenticação AWS</h2>
                <p class="text-slate-400 text-xs mt-1">Gerenciamento de Infraestrutura MBE Cloud</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-cyan-400 tracking-wider uppercase mb-1 ml-1">Região da Nuvem</label>
                    <input type="text" id="aws-region" placeholder="Ex: us-east-1" value="us-east-1"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none text-sm font-mono tracking-wide">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-cyan-400 tracking-wider uppercase mb-1 ml-1">ID da Instância EC2</label>
                    <input type="text" id="aws-instance" placeholder="i-0123456789abcdef0" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none text-sm font-mono tracking-wide">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-cyan-400 tracking-wider uppercase mb-1 ml-1">AWS Access Key ID</label>
                    <input type="text" id="aws-key-id" placeholder="AKIAIOSFODNN7EXAMPLE" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none text-sm font-mono tracking-wide">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-cyan-400 tracking-wider uppercase mb-1 ml-1">AWS Secret Access Key</label>
                    <input type="password" id="aws-secret" placeholder="••••••••••••••••••••••••••••••••••••••••" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none text-sm font-mono tracking-wide">
                </div>
                
                <button onclick="salvarCredenciais()" 
                        class="w-full bg-cyan-600 hover:bg-cyan-500 active:scale-[0.99] transition-all font-bold py-3.5 rounded-xl shadow-lg cursor-pointer mt-4 text-sm tracking-wide text-white uppercase border border-cyan-400/20">
                    Inicializar Conexão Segura
                </button>
            </div>
        </div>
    </div>

    <!-- 2. MAIN PREMIUM CONTROL INTERFACE -->
    <div class="glassmorphism p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-slate-700/50 hidden transition-all duration-500" id="main-dashboard">
        <!-- Dashboard Header -->
        <div class="text-center mb-6">
            <span class="text-[10px] font-extrabold uppercase tracking-widest text-cyan-400 bg-cyan-950/80 border border-cyan-800/50 px-3 py-1 rounded-full shadow-sm">
                Serverless Dashboard v2.0
            </span>
            <h1 class="text-2xl font-black mt-3 tracking-tight text-white">Cloud Manager</h1>
            <p class="text-slate-400 text-xs mt-0.5">Console de Controle de Servidores</p>
        </div>
        
        <!-- Interactive State Hub Area -->
        <div class="bg-slate-950/60 backdrop-blur-md p-4 rounded-xl flex justify-between items-center mb-6 border border-slate-800/80 shadow-inner">
            <div class="flex flex-col">
                <span class="text-[10px] font-extrabold text-slate-500 tracking-wider uppercase">Monitoramento</span>
                <span class="text-xs font-semibold text-slate-300 mt-0.5">Instância AWS Ativa</span>
            </div>
            <span id="status-tag" class="px-3.5 py-1.5 rounded-xl text-xs font-black tracking-wider border transition-all duration-300 shadow-sm">
                VERIFICANDO...
            </span>
        </div>
        
        <!-- Controls Action Matrix -->
        <div class="space-y-3">
            <button onclick="controlarServidor('ligar')" 
                    class="w-full bg-slate-900/60 hover:bg-emerald-950/30 border border-slate-700/60 hover:border-emerald-500/40 text-slate-300 hover:text-emerald-400 active:scale-[0.98] cursor-pointer transition-all font-bold py-4 rounded-xl flex justify-center items-center gap-2.5 text-sm group">
                <span class="transition-transform group-hover:scale-110"></span> Ligar Instância
            </button>
            <button onclick="controlarServidor('desligar')" 
                    class="w-full bg-slate-900/60 hover:bg-rose-950/30 border border-slate-700/60 hover:border-rose-500/40 text-slate-300 hover:text-rose-400 active:scale-[0.98] cursor-pointer transition-all font-bold py-4 rounded-xl flex justify-center items-center gap-2.5 text-sm group">
                <span class="transition-transform group-hover:scale-110"></span> Desligar Instância
            </button>
        </div>
        
        <!-- Actions Lower Tray Footer -->
        <div class="mt-8 pt-4 border-t border-slate-700/30 text-center">
            <button onclick="logout()" class="text-xs text-slate-500 hover:text-rose-400 tracking-wide transition-colors underline cursor-pointer">
                Remover Credenciais do Cache
            </button>
        </div>
    </div>

    <!-- 3. CORE FRONTEND LOGIC COMPONENT (AWS MODULE COMPATIBLE) -->
    <script type="module">
        import { EC2Client, DescribeInstancesCommand, StartInstancesCommand, StopInstancesCommand } from "@aws-sdk/client-ec2";

        let ec2Client = null;
        let instanceId = "";

        window.addEventListener('DOMContentLoaded', () => {
            const savedConfig = localStorage.getItem('mbe_aws_config');
            if (savedConfig) {
                inicializarPainel(JSON.parse(savedConfig));
            }
        });

        window.salvarCredenciais = function() {
            const config = {
                region: document.getElementById('aws-region').value.trim(),
                instanceId: document.getElementById('aws-instance').value.trim(),
                accessKeyId: document.getElementById('aws-key-id').value.trim(),
                secretAccessKey: document.getElementById('aws-secret').value.trim()
            };

            if (!config.region || !config.instanceId || !config.accessKeyId || !config.secretAccessKey) {
                alert("Por favor, preencha todos os campos do terminal de acesso.");
                return;
            }

            localStorage.setItem('mbe_aws_config', JSON.stringify(config));
            inicializarPainel(config);
        };

        function inicializarPainel(config) {
            instanceId = config.instanceId;
            ec2Client = new EC2Client({
                region: config.region,
                credentials: {
                    accessKeyId: config.accessKeyId,
                    secretAccessKey: config.secretAccessKey
                }
            });

            document.getElementById('login-modal').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                document.getElementById('login-modal').classList.add('hidden');
                const mainDash = document.getElementById('main-dashboard');
                mainDash.classList.remove('hidden');
            }, 300);
            
            buscarStatus();
            setInterval(buscarStatus, 10000);
        }
        
        window.logout = function() {
            localStorage.removeItem('mbe_aws_config');
            window.location.reload();
        };
        
        async function buscarStatus() {
            try {
                const command = new DescribeInstancesCommand({ InstanceIds: [instanceId] });
                const data = await ec2Client.send(command);
                const status = data.Reservations[0].Instances[0].State.Name;
                const tag = document.getElementById('status-tag');
                const dashCard = document.getElementById('main-dashboard');
                tag.innerText = status.toUpperCase();
                
                // Clear state styling artifacts
                dashCard.classList.remove('glow-cyan', 'glow-emerald', 'glow-rose');
                tag.style.animation = "none";
                
                if (status === 'running') {
                    tag.className = "px-3.5 py-1.5 rounded-xl text-xs font-black tracking-wider bg-emerald-950/60 text-emerald-400 border-emerald-500/30";
                    dashCard.classList.add('glow-emerald');
                } else if (status === 'stopped') {
                    tag.className = "px-3.5 py-1.5 rounded-xl text-xs font-black tracking-wider bg-rose-950/60 text-rose-400 border-rose-500/30";
                    dashCard.classList.add('glow-rose');
                } else {
                    tag.className = "px-3.5 py-1.5 rounded-xl text-xs font-black tracking-wider bg-amber-950/60 text-amber-400 border-amber-500/30 animate-pulse";
                    tag.style.animation = "subtle-pulse 1.5s infinite ease-in-out";
                }
            } catch (err) {
                const tag = document.getElementById('status-tag');
                tag.innerText = "ERRO CONEXÃO";
                tag.className = "px-3.5 py-1.5 rounded-xl text-xs font-black tracking-wider bg-red-900 text-white border-red-500";
                console.error(err);
            }
        }
        
        window.controlarServidor = async function(acao) {
            const tag = document.getElementById('status-tag');
            tag.innerText = "PROCESSANDO...";
            tag.className = "px-3.5 py-1.5 rounded-xl text-xs font-black tracking-wider bg-cyan-950/60 text-cyan-400 border-cyan-500/30 animate-pulse";
            tag.style.animation = "subtle-pulse 1s infinite ease-in-out";
            
            try {
                const command = acao === 'ligar'
                ? new StartInstancesCommand({ InstanceIds: [instanceId] })
                : new StopInstancesCommand({ InstanceIds: [instanceId] });
                
                await ec2Client.send(command);
                setTimeout(buscarStatus, 4500); // Transitions safely throughpending/stopping phase
                } catch (err) {
                    alert("Erro de autenticação ou limites excedidos: " + err.message);
                    buscarStatus();
                }
            };
    </script>
</body>
</html>
