<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBE - Cloud Infra Dashboard</title>
    
    <!-- Tailwind CSS Core Platform (Link corrigido para o CDN oficial) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styles for Core Interface Animations & Shimmers -->
    <style>
        .glow-cyan { box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.4); }
        .glow-emerald { box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.5); }
        .glow-rose { box-shadow: 0 0 25px -5px rgba(244, 63, 94, 0.5); }
        .glassmorphism {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-[#0b1329] text-slate-100 font-sans flex items-center justify-center h-screen m-0 relative overflow-hidden">

    <!-- Cyberpunk Abstract Background Blurs -->
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- MAIN CONTROL INTERFACE -->
    <div class="glassmorphism p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-slate-700/50 transition-all duration-500 glow-cyan" id="main-dashboard">
        
        <!-- Dashboard Header -->
        <div class="text-center mb-6">
            <span class="text-[10px] font-extrabold uppercase tracking-widest text-cyan-400 bg-cyan-950/80 border border-cyan-800/50 px-3 py-1 rounded-full shadow-sm">
                Secure Backend Control v2.0
            </span>
            <h1 class="text-2xl font-black mt-3 tracking-tight text-white">Cloud Manager</h1>
            <p class="text-slate-400 text-xs mt-0.5">Console de Controle de Servidores</p>
        </div>
        
        <!-- Interactive State Hub Area -->
        <div class="bg-slate-950/60 backdrop-blur-md p-4 rounded-xl flex justify-between items-center mb-6 border border-slate-800/80 shadow-inner">
            <div class="flex flex-col">
                <span class="text-[10px] font-extrabold text-slate-500 tracking-wider uppercase">Monitoramento</span>
                <span class="text-xs font-semibold text-slate-300 mt-0.5">Instância AWS Ativa</span>
            </div>
            <span id="status-tag" class="px-3.5 py-1.5 rounded-xl text-xs font-black tracking-wider border transition-all duration-300 shadow-sm bg-slate-800 border-slate-600 text-slate-400">
                VERIFICANDO...
            </span>
        </div>
        
        <!-- Controls Action Matrix -->
        <div class="space-y-3">
            <button onclick="controlarServidor('ligar')" id="btn-ligar"
                    class="w-full bg-slate-900/60 hover:bg-emerald-950/30 border border-slate-700/60 hover:border-emerald-500/40 text-slate-300 hover:text-emerald-400 active:scale-[0.98] cursor-pointer transition-all font-bold py-4 rounded-xl flex justify-center items-center gap-2.5 text-sm group">
                Ligar Instância
            </button>
            <button onclick="controlarServidor('desligar')" id="btn-desligar"
                    class="w-full bg-slate-900/60 hover:bg-rose-950/30 border border-slate-700/60 hover:border-rose-500/40 text-slate-300 hover:text-rose-400 active:scale-[0.98] cursor-pointer transition-all font-bold py-4 rounded-xl flex justify-center items-center gap-2.5 text-sm group">
                Desligar Instância
            </button>
        </div>
        
        <!-- Action Feedback Toast/Logs Inside Card -->
        <div id="feedback-log" class="mt-4 text-center text-[11px] text-slate-500 font-mono hidden"></div>
    </div>

    <!-- FRONTEND LOGIC CONNECTED TO NODE.JS BACKEND -->
    <script>
        const statusTag = document.getElementById('status-tag');
        const feedbackLog = document.getElementById('feedback-log');

        function atualizarEstiloStatus(status) {
            const estado = status.toLowerCase();
            statusTag.innerText = status.toUpperCase();
            
            statusTag.className = "px-3.5 py-1.5 rounded-xl text-xs font-black tracking-wider border transition-all duration-300 shadow-sm";

            if (estado === 'running') {
                statusTag.classList.add('bg-emerald-950/80', 'border-emerald-500/50', 'text-emerald-400', 'animate-pulse');
            } else if (estado === 'stopped') {
                statusTag.classList.add('bg-rose-950/80', 'border-rose-500/50', 'text-rose-400');
            } else if (estado === 'pending' || estado === 'stopping') {
                statusTag.classList.add('bg-amber-950/80', 'border-amber-500/50', 'text-amber-400', 'animate-bounce');
            } else {
                statusTag.classList.add('bg-slate-800', 'border-slate-600', 'text-slate-400');
            }
        }

        async function atualizarStatus() {
            try {
                const response = await fetch('/api/status');
                if (!response.ok) throw new Error('Falha na resposta do servidor');
                const data = await response.json();
                atualizarEstiloStatus(data.status);
            } catch (error) {
                console.error("Erro ao buscar status:", error);
                atualizarEstiloStatus("ERRO API");
            }
        }

        async function controlarServidor(acao) {
            feedbackLog.classList.remove('hidden');
            feedbackLog.innerText = `Processando comando: ${acao}...`;
            feedbackLog.className = "mt-4 text-center text-[11px] font-mono text-cyan-400";

            try {
                const response = await fetch(`/api/${acao}`, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();

                if (response.ok) {
                    feedbackLog.innerText = data.message || `Sucesso ao ${acao}!`;
                    feedbackLog.className = "mt-4 text-center text-[11px] font-mono text-emerald-400";
                    
                    setTimeout(atualizarStatus, 2000);
                } else {
                    throw new Error(data.error || 'Erro desconhecido no servidor');
                }
            } catch (error) {
                feedbackLog.innerText = `Erro: ${error.message}`;
                feedbackLog.className = "mt-4 text-center text-[11px] font-mono text-rose-400";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            atualizarStatus();
            setInterval(atualizarStatus, 10000);
        });
    </script>
</body>
</html>
